global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "local-demo"
    env: "dev"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Sample application
  - job_name: "sample-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "sample-app"
          env: "demo"
